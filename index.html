<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2311100f' stroke='%23e5a93c' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23f3efe6' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23e5a93c'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11100f" />
    <meta name="description" content="Chụp ảnh photobooth chuẩn 35mm ngay trong trình duyệt, tải bản in chất lượng cao hoặc quét QR sang LiveGallery." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <script>
      try {
        if (localStorage.getItem('khoanhkhac-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#f3efe6');
        }
      } catch (e) {}
    </script>
    <title>Khoảnh Khắc · 35mm Photobooth</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
